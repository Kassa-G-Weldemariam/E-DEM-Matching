[project]
name = "edem-api"
version = "0.1.0"
description = "E-DEM Matching API"
readme = "README.md"
authors = [
    { name = "Kassa", email = "kassagebrekidan550@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "arq>=0.28.0",
    "fastapi>=0.162.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "python-jose>=3.5.0",
    "redis>=5.3.1",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.ruff]
extend-exclude = ["alembic/versions"]

[tool.mypy]
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]
